services:
  db:
    image: postgres:16-alpine
    container_name: lectnote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - lectnote_pgdata:/var/lib/postgresql/data
      # creates the tables on the first start only
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api:  (ASP.NET Core) will be added here
  # web:  (React behind Nginx) will be added here

volumes:
  lectnote_pgdata:
